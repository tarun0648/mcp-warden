<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}warden approvals{% endblock %}</title>
  {# htmx is told not to inject its own <style> (the CSP forbids inline styles) and never to
     evaluate code from attributes or swapped-in <script> tags. Every value on this page comes
     from an attacker, so the page must not be able to execute anything it renders. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  {# Pinned, integrity-checked, and the only script on the page. #}
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="/approvals/static/approvals.css">
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
