# Resource abuse: making the gateway or its caller pay more than the call is worth.
cases:
- id: rs-001-oversized-result-is-denied-not-truncated
  category: resource_abuse
  attack: true
  role: redteam
  description: 'A one-megabyte result against a 64 KB cap. Denied rather than truncated: a silently
    shortened result is worse than an error, because the reader cannot tell something is missing.'
  gateway: &id001
    limits:
      max_result_bytes: 65536
  pre_approve:
  - evil__huge_output
  steps:
  - tool: evil__huge_output
    args:
      kb: 1024
    expect: denied
    reason: WARDEN_DENIED:output_too_large
- id: rs-002-oversized-arguments-are-denied
  category: resource_abuse
  attack: true
  role: editor
  description: A payload over the argument cap is refused locally, before it costs a rate-limit token
    or is shipped into a Lua script to be measured.
  gateway:
    limits:
      max_argument_bytes: 2048
  steps:
  - tool: files__write_file
    args:
      path: big.md
      content: 
    expect: denied
    reason: WARDEN_DENIED:output_too_large
- id: rs-003-a-slow-upstream-hits-the-timeout
  category: resource_abuse
  attack: true
  role: redteam
  description: A tool that sleeps for thirty seconds against a ten-second upstream timeout. The gateway
    must give up rather than hold the caller open.
  pre_approve:
  - evil__slow_tool
  steps:
  - tool: evil__slow_tool
    args:
      seconds: 30
    expect: denied
    reason: WARDEN_UPSTREAM_TIMEOUT
- id: rs-004-a-result-inside-the-limit-still-comes-through
  category: resource_abuse
  attack: false
  role: redteam
  description: 'The false-positive partner: a 32 KB result under a 64 KB cap must be returned intact.'
  gateway: *id001
  pre_approve:
  - evil__huge_output
  steps:
  - tool: evil__huge_output
    args:
      kb: 32
    expect: allowed
- id: rs-005-a-large-but-legal-file-write-works
