- id: bn-overwrite-a-file
  role: editor
  description: Writing over an existing file, which is a replace rather than a create.
  steps:
  - tool: files__write_file
    args:
      path: notes/twice.md
      content: first
    expect: allowed
  - tool: files__write_file
    args:
      path: notes/twice.md
      content: second
    expect: allowed
  attack: false
  category: benign_workflow
- id: bn-sql-145489
  role: editor
  category: benign_sql
  description: 'Read-only SQL: a plain projection.'
  steps:
  - tool: notes_db__run_sql
    args:
      query: SELECT id, title FROM notes ORDER BY id LIMIT 5
    expect: allowed
  attack: false
- id: bn-sql-130775
  role: editor
  category: benign_sql
  description: 'Read-only SQL: an aggregate.'
  steps:
  - tool: notes_db__run_sql
    args:
      query: SELECT COUNT(*) AS n FROM notes
    expect: allowed
  attack: false
- id: bn-sql-225106
  role: editor
  category: benign_sql
  description: 'Read-only SQL: a LIKE filter.'
  steps:
  - tool: notes_db__run_sql
    args:
      query: SELECT title FROM notes WHERE body LIKE '%policy%'
    expect: allowed
  attack: false
- id: bn-sql-961141
  role: editor
  category: benign_sql
  description: 'Read-only SQL: selecting the ''created'' column, which must not look like CREATE.'
  steps:
  - tool: notes_db__run_sql
    args:
      query: SELECT id, created FROM notes WHERE id > 5
    expect: allowed
  attack: false
- id: bn-sql-27422
  role: editor
  category: benign_sql
  description: 'Read-only SQL: a read-only CTE.'
  steps:
  - tool: notes_db__run_sql
    args:
      query: WITH t AS (SELECT id FROM notes) SELECT COUNT(*) AS n FROM t
    expect: allowed
  attack: false
- id: bn-sql-624173
  role: editor
  category: benign_sql
  description: 'Read-only SQL: an allowed aggregate function.'
  steps:
  - tool: notes_db__run_sql
    args:
      query: SELECT group_concat(title) AS titles FROM notes
    expect: allowed
  attack: false
- id: bn-missing-file-is-an-upstream-error
  role: editor
  category: benign_upstream_errors
  description: Reading a file that does not exist. The files server answers; the gateway allowed the
    call.
  steps:
  - tool: files__read_file
    args:
      path: notes/not-here.md
    expect: upstream_error
  attack: false
- id: bn-missing-note-is-an-upstream-error
  role: editor
  category: benign_upstream_errors
  description: Fetching a note id that does not exist.
  steps:
  - tool: notes_db__get_note
    args:
      note_id: 9999
    expect: upstream_error
  attack: false
- id: bn-listing-a-file-as-a-directory
  role: editor
  category: benign_upstream_errors
  description: A type error from the tool, passed through as the tool's own answer.
  steps:
  - tool: files__write_file
    args:
      path: notes/afile.md
      content: x
    expect: allowed
  - tool: files__list_files
    args:
      path: notes/afile.md
    expect: upstream_error
  attack: false
- id: bn-approved-evil-tool-works
  role: redteam
  category: benign_after_approval
  description: Once an admin approves it, a tool on the untrusted server works like any other. Approval
    has to actually do something.
  pre_approve:
  - evil__get_weather
  steps:
  - tool: evil__get_weather
    args:
      city: Lisbon
    expect: allowed
  attack: false
- id: bn-approved-tool-visible-again
  role: redteam
  category: benign_after_approval
  kind: listing
  description: An approved tool reappears in the listing, so the model can find it.
  pre_approve:
  - evil__get_weather
  listing:
    visible:
    - evil__get_weather
    hidden:
    - evil__read_file
  attack: false
- id: bn-admin-sees-both-real-servers
  role: admin
  kind: listing
  description: An admin sees every tool on the two trusted servers, and still nothing unreviewed.
  listing:
    visible:
    - notes_db__run_sql
    - notes_db__delete_note
    - files__delete_file
    - files__read_file
    hidden:
    - evil__get_weather
    - evil__add_numbers
  attack: false
  category: benign_workflow
- id: bn-reader-sees-its-reads
  role: reader
  kind: listing
  description: A reader sees the read tools it is entitled to.
  listing:
    visible:
    - notes_db__list_notes
    - notes_db__get_note
    - notes_db__search_notes
    - files__read_file
    - files__list_files
    hidden:
    - files__delete_file
  attack: false
  category: benign_workflow
- id: bn-list-files-without-a-path
  role: editor
  description: >-
    Listing the sandbox the way the tool's schema allows, with `path` omitted. The schema
    defaults it to ".", which the gateway fills from the pinned definition before policy runs.
    Missing from the suite until the soak test found this call refused.
  steps:
  - tool: files__list_files
    args: {}
    expect: allowed
  attack: false
  category: benign_workflow
- id: bn-list-notes-without-a-limit
  role: reader
  description: Listing notes with `limit` left to its schema default of 20.
  steps:
  - tool: notes_db__list_notes
    args: {}
    expect: allowed
  attack: false
  category: benign_workflow
