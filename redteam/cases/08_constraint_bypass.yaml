- id: cb-012-oversized-note-title-refused
  category: constraint_bypass
  attack: true
  role: editor
  description: An argument constraint caps the title length. A tool whose own schema is looser must
    still obey the policy.
  steps:
  - tool: notes_db__create_note
    args:
      title: 
      body: b
    expect: denied
    reason: WARDEN_DENIED:policy
- id: cb-013-note-id-below-the-minimum
  category: constraint_bypass
  attack: true
  role: editor
  description: A numeric constraint with a minimum. Zero and negative ids are the probing values.
  steps:
  - tool: notes_db__delete_note
    args:
      note_id: 0
    expect: denied
    reason: WARDEN_DENIED:policy
- id: cb-014-ordinary-relative-paths-still-work
  category: constraint_bypass
  attack: false
  role: editor
  description: The false-positive partner. A path constraint that refused ordinary nested paths would
    make the files server unusable.
  steps:
  - tool: files__write_file
    args:
      path: notes/deep/nested/file.md
      content: fine
    expect: allowed
  - tool: files__read_file
    args:
      path: notes/deep/nested/file.md
    expect: allowed
- id: cb-015-a-normal-select-still-works
  category: constraint_bypass
  attack: false
  role: editor
  description: Read-only SQL is the point of the tool and must keep working.
  steps:
  - tool: notes_db__run_sql
    args:
      query: SELECT COUNT(*) AS n FROM notes
    expect: allowed
- id: cb-016-a-path-containing-dots-is-not-traversal
  category: constraint_bypass
  attack: false
  role: editor
  description: A file called release.v1.2.md contains dots but climbs nowhere. Refusing it would be
    the over-eager version of the traversal check.
  steps:
  - tool: files__write_file
    args:
      path: notes/release.v1.2.md
      content: notes
    expect: allowed
- id: cb-017-a-read-only-cte-is-allowed
  category: constraint_bypass
  attack: false
  role: editor
  description: A WITH clause is not inherently a write. Blocking every CTE would be the lazy version
    of the SQL guard.
  steps:
  - tool: notes_db__run_sql
    args:
      query: WITH recent AS (SELECT id FROM notes WHERE id > 5) SELECT COUNT(*) AS n FROM recent
    expect: allowed
