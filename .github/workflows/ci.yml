name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/warden servers

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pytest -m unit -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden_dev_password_change_me
          POSTGRES_DB: warden
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warden -d warden"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      # The coverage gate lives on the integration job because that is the one with real
      # Postgres and Redis, so it measures the paths that actually ship.
      - run: >-
          uv run pytest -m "unit or integration" -q
          --cov=src/warden --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
        env:
          DATABASE_URL: postgresql+asyncpg://warden:warden_dev_password_change_me@localhost:5432/warden
          REDIS_URL: redis://localhost:6379/0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  redteam:
    # Rules only: CI has no model weights, and a run that silently fell back to rules while
    # labelling itself "with classifier" would be worse than not running it.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden_dev_password_change_me
          POSTGRES_DB: warden
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warden -d warden"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      # Exits non-zero on any case error and on any regression against results/baseline.json.
      - run: uv run python -m redteam.runner --rules-only
        env:
          DATABASE_URL: postgresql+asyncpg://warden:warden_dev_password_change_me@localhost:5432/warden
          REDIS_URL: redis://localhost:6379/0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-report
          path: results/redteam-*.*
