# Scrapes the gateway. `host.docker.internal` is how a container reaches a gateway running on
# the Mac itself; a containerised gateway would be `warden:8080`.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mcp-warden
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          instance: local
