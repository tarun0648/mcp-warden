[project]
name = "mcp-warden"
version = "0.1.0"
description = "A security gateway for the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "mcp==2.3.0",
    "starlette>=0.41,<2",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.21,<1",
    "alembic>=1.15,<2",
    "redis>=5.2,<9",
    "pyjwt>=2.10,<3",
    "cryptography>=44,<48",
    "httpx>=0.28,<1",
    "typer>=0.15,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "opentelemetry-sdk>=1.31,<2",
    "opentelemetry-api>=1.31,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
    "prometheus-client>=0.21,<1",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.49,<6",
    "torch>=2.6,<3",
]
agent = [
    "ollama>=0.4,<1",
]
bench = [
    "matplotlib>=3.10,<4",
]

[project.scripts]
warden = "warden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6.0,<8",
    "hypothesis>=6.127,<7",
    "fakeredis>=2.27,<3",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "mypy>=1.15,<3",
    "pre-commit>=4.1,<5",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "servers", "redteam", "bench", "agent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
# ASYNC109: a `timeout` parameter is deliberate on our connection APIs - the deadline belongs
# to the upstream's configuration, not to whichever task happens to call it.
ignore = ["S101", "S311", "B008", "RUF012", "N818", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"servers/evil/**" = ["S", "E501"]
"redteam/**" = ["S"]
"bench/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "transformers.*", "torch.*", "ollama.*", "matplotlib.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: no network, no docker, fakes only",
    "integration: needs real MCP sessions and/or docker compose services",
    "e2e: full stack, needs Ollama",
    "redteam: attack suite",
    "perf: latency benchmarks",
    "ml: needs the local classifier model (uv sync --extra ml)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/warden"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
